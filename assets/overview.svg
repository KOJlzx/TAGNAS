<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TAGNAS heterogeneous execution</title>
  <desc id="desc">A CPU graph supernet and GPU language model replicas train concurrently, exchange embeddings via a coordinator and bilateral caches, and periodically average language model replicas. Online pruning reduces graph candidates.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2f6fc"/><stop offset="1" stop-color="#eaf6f2"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52758e"/></marker>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="52" font-size="14" font-weight="700" letter-spacing="2" fill="#45627b">TAGNAS / EXECUTION OVERVIEW</text>
    <text x="52" y="92" font-size="27" font-weight="700" fill="#142c45">Two engines. Concurrent training.</text>
    <rect x="52" y="130" width="315" height="211" rx="14" fill="white" stroke="#a6bfdc"/>
    <rect x="52" y="130" width="315" height="6" rx="3" fill="#3266a1"/>
    <text x="76" y="170" font-size="13" font-weight="700" fill="#3266a1">CPU</text>
    <text x="76" y="205" font-size="23" font-weight="700" fill="#142c45">Graph Supernet Engine</text>
    <text x="76" y="238" font-size="16" fill="#4b6073">Search candidate GNN operators</text>
    <text x="76" y="264" font-size="16" fill="#4b6073">Train weights and architecture</text>
    <rect x="76" y="285" width="211" height="32" rx="16" fill="#eaf0fb"/>
    <text x="93" y="307" font-size="14" fill="#28568d">Online architecture pruning</text>
    <rect x="443" y="154" width="310" height="164" rx="14" fill="white" stroke="#b5c4d1"/>
    <text x="467" y="192" font-size="18" font-weight="700" fill="#142c45">Coordinator + bilateral caches</text>
    <text x="467" y="225" font-size="16" fill="#4b6073">Node IDs · embeddings · versions</text>
    <text x="467" y="251" font-size="16" fill="#4b6073">Asynchronous bidirectional push</text>
    <text x="467" y="283" font-size="14" fill="#52758e">Read cached peer targets / drop on miss</text>
    <rect x="829" y="130" width="319" height="211" rx="14" fill="white" stroke="#92beb1"/>
    <rect x="829" y="130" width="319" height="6" rx="3" fill="#207b65"/>
    <text x="853" y="170" font-size="13" font-weight="700" fill="#207b65">GPU 0 ... N−1</text>
    <text x="853" y="205" font-size="21" font-weight="700" fill="#142c45">Language Model Engines</text>
    <text x="853" y="238" font-size="16" fill="#4b6073">Encode node text on each replica</text>
    <text x="853" y="264" font-size="16" fill="#4b6073">Train against cached graph targets</text>
    <rect x="853" y="285" width="245" height="32" rx="16" fill="#e4f3ed"/>
    <text x="870" y="307" font-size="14" fill="#206b58">Periodic LM replica averaging</text>
    <path d="M378 235H431 M765 235H817" fill="none" stroke="#52758e" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="52" y="385" font-size="15" fill="#4b6073">Output: a selected graph architecture, trained encoders, and source-bound experiment artifacts.</text>
  </g>
</svg>
