[project]
name = "clip-graph"
version = "0.0.1"
description = "CLIP for graphs"
requires-python = ">=3.11,<3.12"
authors = [
    {name = "Anonymous", email = "anonymous@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "torch==2.6.0",
    "torch-geometric>=2.6.1",
    "pytorch-lightning>=2.5.2",
    "transformers>=4.44.2",
    "datasets>=3.2.0",
    "huggingface-hub>=0.27.1",
    # Pin an explicit pyarrow version range to avoid a build-from-source install.
    "pyarrow>=14.0.0,<21.0.0",
    # dgl temporarily removed; install it manually if needed.
    # "dgl>=2.1.0",
    "numpy==2.1.3",
    # Pin scipy to a version with a prebuilt wheel.
    "scipy>=1.15.3,<1.16.0",
    "pandas>=2.2.3",
    "scikit-learn==1.6.1",
    "einops>=0.8.0",
    "tqdm>=4.67.1",
    "pyyaml>=6.0.2",
    "tensorboard>=2.19.0",
    "torchmetrics>=1.7.4",
    "peft>=0.15.2",
    "sentence-transformers>=5.0.0",
    "omegaconf>=2.3.0",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "jsonargparse[signatures]>=4.27.7",
    "utils>=1.0.2",
    "ogb>=1.3.6",
    "pandasql>=0.7.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "deepspeed>=0.18.9",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pylint",
    "pytest",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
torch-scatter = ["torch"]
torch-sparse = ["torch"]


[build-system]
requires = ["setuptools >= 46.4.0", "wheel"]
build-backend = "setuptools.build_meta"

# src-layout: the importable package is src/clip_graph/.
[tool.setuptools]
zip-safe = true
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]



# PyTorch CUDA wheel index
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]
torchvision = [
  { index = "pytorch-cu124" },
]


[tool.uv]
# Tell uv to also search this wheel index page if a package isn't on the official
# index (equivalent to pip's -f flag).
find-links = [
    "https://data.pyg.org/whl/torch-2.6.0+cu124.html"
]


##
## Pylint
##

[tool.pylint.master]
jobs = 0
persistent= "yes"
suggestion-mode = "yes"

[tool.pylint.messages_control]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "unnecessary-pass",
]

[tool.pylint.reports]
reports = "yes"
score = "yes"

[tool.pylint.logging]
logging-format-style = "new"
logging-modules = "logging"

[tool.pylint.variables]
allow-global-unused-variables = "yes"
init-import = "no"

[tool.pylint.format]
expected-line-ending-format = "LF"
max-line-length = 127
